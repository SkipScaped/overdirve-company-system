<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#694322"/>
  
  <!-- Minecraft character head -->
  <rect x="50" y="40" width="100" height="100" fill="#a0734c"/>
  
  <!-- Eyes -->
  <rect x="70" y="65" width="20" height="20" fill="#222"/>
  <rect x="110" y="65" width="20" height="20" fill="#222"/>
  
  <!-- Mouth -->
  <rect x="80" y="100" width="40" height="10" fill="#222"/>
  
  <!-- Hair/hat details -->
  <rect x="50" y="40" width="100" height="20" fill="#5a3920"/>
  <rect x="50" y="40" width="20" height="60" fill="#5a3920"/>
  <rect x="130" y="40" width="20" height="60" fill="#5a3920"/>
  
  <!-- Username text placeholder -->
  <rect x="40" y="150" width="120" height="30" rx="5" fill="#5bae4a"/>
</svg>